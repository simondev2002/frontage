# Codemagic builds the iOS app on a cloud Mac and uploads it to TestFlight, so no
# Mac is needed. Same signing approach as Jetlo (simjolly-ios/codemagic.yaml):
#   1. Add this GitHub repository in Codemagic.
#   2. Settings > Integrations > Developer Portal: an App Store Connect API key
#      named exactly "Frontage ASC" (Issuer ID, Key ID and the .p8 file from
#      App Store Connect > Users and Access > Integrations > App Store Connect API).
#   3. An environment variable group named "appstore" containing
#      CERTIFICATE_PRIVATE_KEY (secure): the RSA private key the team's
#      distribution certificate was built from. It is the same group and key
#      Jetlo uses; the certificate "S.MAKELA GAMES LTD (Distribution)" in the
#      developer portal belongs to it, and the "Frontage App Store" profile
#      already includes that certificate.
#   4. Start the "ios-testflight" workflow (it also runs on every push to main).
workflows:
  ios-testflight:
    name: Frontage iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Frontage ASC
    environment:
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.frontage.app
        XCODE_PROJECT: "ios/Frontage.xcodeproj"
        XCODE_SCHEME: "Frontage"
        APP_STORE_APPLE_ID: 6809199627
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      # The build number must rise on every upload. Take the largest of: TestFlight's
      # latest + 1, Codemagic's own build counter, and the git commit count, and write it
      # into project.yml before XcodeGen runs so the archive cannot ignore it.
      - name: Pick the next build number
        script: |
          set -uo pipefail
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -dc "0-9")
          COMMITS=$(git rev-list --count HEAD)
          NEXT=$(( ${LATEST:-0} + 1 ))
          for c in "${BUILD_NUMBER:-0}" "$COMMITS"; do if [ "$c" -gt "$NEXT" ]; then NEXT=$c; fi; done
          echo "TestFlight latest: '${LATEST:-none}'  Codemagic BUILD_NUMBER: '${BUILD_NUMBER:-unset}'  commits: $COMMITS  -> build number $NEXT"
          echo "NEXT_BUILD=$NEXT" >> "$CM_ENV"
      - name: Generate the Xcode project (XcodeGen, from ios/project.yml)
        script: |
          set -euo pipefail
          perl -pi -e "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEXT_BUILD\"/" ios/project.yml
          grep -n "CURRENT_PROJECT_VERSION" ios/project.yml
          brew install xcodegen
          cd ios
          xcodegen generate
      # Fetches the distribution certificate and the App Store profile for the
      # bundle id, creating them when absent, using the private key from the
      # "appstore" group so the existing certificate is reused.
      - name: Set up signing, creating certificate and profile if absent
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key=@env:CERTIFICATE_PRIVATE_KEY             --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the IPA
        script: |
          set -euo pipefail
          echo "Archiving with build number $NEXT_BUILD"
          xcode-project build-ipa             --project "$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"             --archive-xcargs "CURRENT_PROJECT_VERSION=$NEXT_BUILD"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The internal "Frontage team" group has automatic distribution, so
        # every build reaches it without beta review. Switch to true and add
        # beta_groups once the server is live and the TestFlight test information
        # (feedback email, review contact, sign-in) is filled in.
        submit_to_testflight: false

  # Cheap sanity check for the Node server on every push (no Mac minutes used).
  server-check:
    name: Frontage server check
    max_build_duration: 15
    instance_type: linux_x2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Install and syntax-check
        script: |
          cd server
          npm ci --omit=dev
          for f in src/*.js src/*/*.js scripts/*.js; do node --check "$f"; done
          node scripts/render-demo.js bold
    artifacts:
      - server/data/demo-bold.html
